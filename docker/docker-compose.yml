name: ads-keyword-platform

services:
  ads-keyword-platform:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: ads-keyword-platform:latest
    container_name: ads-keyword-platform
    restart: unless-stopped
    ports:
      - "18445:18445"
    volumes:
      - ../data:/app/data
      - ../cache:/app/cache
    environment:
      - PORT=18445
      - DB_PATH=/app/data/ads.db
      - TZ=Asia/Shanghai
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:18445/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - ads-keyword-net

networks:
  ads-keyword-net:
    driver: bridge
