name: ads-keyword-platform

services:
  ads-keyword-platform:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: ads-keyword-platform:latest
    container_name: ads-keyword-platform
    restart: unless-stopped
    ports:
      - "18445:18444"
    volumes:
      - ads-keyword-data:/app/data
      - ads-keyword-cache:/app/cache
    environment:
      - PORT=18444
      - DB_PATH=/app/data/ads.db
      - TZ=Asia/Shanghai
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:18444/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - ads-keyword-net

volumes:
  ads-keyword-data:
    name: ads-keyword-platform-data
  ads-keyword-cache:
    name: ads-keyword-platform-cache

networks:
  ads-keyword-net:
    driver: bridge
